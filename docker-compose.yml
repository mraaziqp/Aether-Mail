services:
  postgres:
    image: postgres:16-alpine
    container_name: aethermail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: aethermail
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aethermail"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aethermail-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  stalwart:
    image: stalwartlabs/mail-server:latest
    container_name: aethermail-stalwart
    restart: unless-stopped
    ports:
      - "25:25"      # SMTP Inbound
      - "587:587"    # SMTP Submission (STARTTLS)
      - "465:465"    # SMTPS
      - "143:143"    # IMAP
      - "993:993"    # IMAPS
      - "8080:8080"  # HTTP Management, JMAP & REST API
    environment:
      - STALWART_PATH=/opt/stalwart-mail
    volumes:
      - stalwart_data:/opt/stalwart-mail

volumes:
  postgres_data:
  stalwart_data:
